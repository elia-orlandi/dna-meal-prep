<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mappa Alimentare Interattiva</title>
    <!-- Link new CSS for combinations -->
    <link rel="stylesheet" href="combinations.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Mappa Alimentare</h1>
        <p class="subtitle">Dati scientifici aggiornati al 16-02-2015 (Release 5.1)</p>
        <div class="search-container">
            <label for="searchInput" class="sr-only">Cerca alimento</label>
            <input type="search" id="searchInput" placeholder="Cerca un alimento..." aria-label="Cerca alimento" autocomplete="off" aria-haspopup="listbox" aria-controls="suggestionsList">
            <button type="button" id="clearSearchBtn" class="clear-search-button" aria-label="Pulisci ricerca" hidden>×</button>
            <div id="suggestionsContainer" class="suggestions-container" role="listbox" aria-labelledby="searchInput">
                 <ul id="suggestionsList" class="suggestions-list"></ul>
            </div>
        </div>

         <!-- Add Combination Button -->
         <div class="global-actions">
             <button type="button" id="addCombinationBtn">Aggiungi Combinazione</button>
             <!-- <button type="button" id="viewCombinationsBtn">Mostra/Nascondi Combinazioni</button> -->
         </div>

    </header>

    <main>
        <!-- Original Food List Area -->
        <div id="foodListArea">
            <h2>Elenco Alimenti</h2>
            <div id="foodListContainer">
                <p class="loading-message">Caricamento dati alimenti...</p>
            </div>
        </div>

         <hr class="section-divider">

        <!-- Combinations Display Area -->
        <div id="combinationsArea">
             <h2>Le tue Combinazioni Pasto</h2>
             <div id="combinationsListContainer" class="combinations-list-container">
                 <!-- Combinations list generated by JS -->
                 <p>Caricamento combinazioni...</p>
             </div>
        </div>

    </main>

    <footer>
        <!-- Legend Switcher -->
        <div class="legend-switcher" role="radiogroup" aria-labelledby="legend-choice-label">
             <span id="legend-choice-label" class="legend-switcher-label">Scegli Legenda:</span>
             <button type="button" role="radio" aria-checked="true" class="legend-button active" data-legend-id="original">Standard</button>
             <button type="button" role="radio" aria-checked="false" class="legend-button" data-legend-id="alternative">Alternativa</button>
        </div>
        <p>Legenda Valori Attiva:</p>
        <ul class="legend" id="footerLegendDisplay"></ul>
    </footer>

    <!-- Combination Form Modal -->
    <dialog id="combinationFormModal" class="combination-form-modal">
         <!-- Form generated by combination-ui.js will go here -->
         <p>Caricamento form...</p>
    </dialog>

    <!-- Load Scripts -->
    <script src="storage.js"></script>
    <script src="combination-ui.js"></script>
    <script src="combinations.js"></script>
    <script src="script.js"></script> <!-- Load main script last -->
</body>
</html>
