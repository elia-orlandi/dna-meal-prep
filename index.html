<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mappa Alimentare Interattiva</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Mappa Alimentare</h1>
        <p class="subtitle">Dati scientifici aggiornati al 16-02-2015 (Release 5.1)</p>
        <div class="search-container">
            <label for="searchInput" class="sr-only">Cerca alimento</label>
            <input type="search" id="searchInput" placeholder="Cerca un alimento..." aria-label="Cerca alimento">
        </div>
    </header>

    <main id="foodListContainer">
        <!-- Contenuto generato da JavaScript -->
        <p class="loading-message">Caricamento dati...</p>
    </main>

    <footer>
        <!-- Legend Switcher -->
        <div class="legend-switcher" role="radiogroup" aria-labelledby="legend-choice-label">
             <span id="legend-choice-label" class="legend-switcher-label">Scegli Legenda:</span>
             <button type="button" role="radio" aria-checked="true" class="legend-button active" data-legend-id="original">Standard</button>
             <button type="button" role="radio" aria-checked="false" class="legend-button" data-legend-id="alternative">Alternativa</button>
        </div>

        <!-- Legend Display -->
        <p>Legenda Valori Attiva:</p>
        <ul class="legend" id="footerLegendDisplay">
            <!-- Contenuto generato da JavaScript -->
        </ul>
    </footer>

    <script src="script.js"></script>
</body>
</html>
